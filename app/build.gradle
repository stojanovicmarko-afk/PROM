plugins {
    id 'com.android.application'
}

android {
    namespace 'si.medicofit.prom'
    compileSdk 35

    signingConfigs {
        medicofit {
            storeFile file('medicofit-prom-keystore.jks')
            storePassword 'MedicofitPROM2026!'
            keyAlias 'medicofit-prom'
            keyPassword 'MedicofitPROM2026!'
        }
    }

    defaultConfig {
        applicationId 'si.medicofit.prom'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.medicofit
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.medicofit
        }
    }
}
